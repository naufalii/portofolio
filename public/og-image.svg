<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" shape-rendering="crispEdges">
  <!-- Sky Background -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68B0DE" />
      <stop offset="100%" stop-color="#8FC6E8" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)" />

  <!-- Pixel Clouds -->
  <rect x="120" y="80" width="220" height="40" fill="#FFFFFF" opacity="0.8" />
  <rect x="140" y="60" width="180" height="60" fill="#FFFFFF" opacity="0.8" />
  <rect x="780" y="120" width="280" height="50" fill="#FFFFFF" opacity="0.75" />
  <rect x="810" y="90" width="220" height="80" fill="#FFFFFF" opacity="0.75" />

  <!-- Far Mountain Silhouette -->
  <polygon points="0,420 280,260 520,420 840,240 1200,430 1200,630 0,630" fill="#486B47" opacity="0.6" />

  <!-- Mid Hills -->
  <polygon points="0,480 340,360 700,500 1020,380 1200,490 1200,630 0,630" fill="#3B5E34" />

  <!-- Foreground Meadow -->
  <rect y="490" width="1200" height="140" fill="#5E8B4A" />

  <!-- Central Parchment Frame -->
  <rect x="180" y="160" width="840" height="310" fill="#3A2A1E" />
  <rect x="190" y="170" width="820" height="290" fill="#F6EBD3" />

  <!-- Corner Accents -->
  <rect x="180" y="160" width="20" height="20" fill="#E8793A" />
  <rect x="1000" y="160" width="20" height="20" fill="#E8793A" />
  <rect x="180" y="450" width="20" height="20" fill="#E8793A" />
  <rect x="1000" y="450" width="20" height="20" fill="#E8793A" />

  <!-- Title & Text -->
  <text x="600" y="240" font-family="'Pixelify Sans', monospace, sans-serif" font-size="44" font-weight="bold" fill="#3A2A1E" text-anchor="middle" letter-spacing="2">
    NAUFAL ALI HILMI
  </text>
  
  <rect x="360" y="265" width="480" height="36" fill="#E8793A" />
  <text x="600" y="290" font-family="'Pixelify Sans', monospace, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    SYSTEM ADMINISTRATOR / ORACLE DBA
  </text>

  <text x="600" y="350" font-family="'Nunito', sans-serif" font-size="22" fill="#3A2A1E" text-anchor="middle">
    Universitas Gunadarma — Sistem Informasi
  </text>

  <text x="600" y="395" font-family="'Pixelify Sans', monospace, sans-serif" font-size="16" fill="#5E8B4A" text-anchor="middle">
    OVERWORLD PORTFOLIO (GHIBLI × PIXEL ART)
  </text>

  <text x="600" y="430" font-family="'Nunito', sans-serif" font-size="16" fill="#3A2A1E" opacity="0.8" text-anchor="middle">
    github.com/naufalii • linkedin.com/in/naufalalihilmi
  </text>
</svg>
